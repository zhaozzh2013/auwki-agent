name: Windows Build

on:
  workflow_dispatch:        # 手动触发（Actions 页面 → Run workflow）
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 拉取依赖
        run: flutter pub get

      - name: 全量测试
        run: flutter test

      - name: 修复 webview_windows 的 WIL 版本（新 MSVC/C++20 coroutine 兼容）
        # 根因：WIL 1.0.220914.1 的 wil/coroutine.h 在 MSVC 14.5x + /std:c++20 下
        # include <experimental/coroutine> 触发 STL1011 硬错误；升级 WIL 即修复。
        # 版本号实时查询 nuget（不写死，避免版本不存在导致 nuget 安装失败）。
        shell: pwsh
        run: |
          $ver = (Invoke-RestMethod 'https://api.nuget.org/v3-flatcontainer/microsoft.windows.implementationlibrary/index.json').versions[-1]
          Write-Host "最新 WIL 版本: $ver"
          $f = 'windows/flutter/ephemeral/.plugin_symlinks/webview_windows/windows/CMakeLists.txt'
          $c = Get-Content $f -Raw
          $c = $c -replace 'set\(WIL_VERSION "1\.0\.220914\.1"\)', ("set(WIL_VERSION `"$ver`")")
          Set-Content $f $c
          Select-String 'WIL_VERSION' $f

      - name: 构建 Windows Release
        run: flutter build windows --release

      - name: 打包免安装版 zip
        shell: pwsh
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath AUWKI-Agent-windows-x64.zip -Force

      - name: 安装 Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: 构建安装包 Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            installer\AUWKI-Agent.iss `
            /DStageDir="$env:GITHUB_WORKSPACE\build\windows\x64\runner\Release" `
            /DAppVersion=10.0.0
          Copy-Item dist\installer\*.exe .
        # ISCC 输出目录由 .iss 的 OutputDir 决定（..\..\dist\installer），拷贝到工作区根

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: AUWKI-Agent-windows-x64
          path: |
            AUWKI-Agent-windows-x64.zip
            AUWKI-Agent-Setup-*.exe
          if-no-files-found: error